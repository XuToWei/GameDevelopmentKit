# 将此文件放入 Nginx 的 /etc/nginx/conf.d/，由 nginx.conf 的 http 块加载。
# 部署前替换域名和证书路径。示例按 Nginx 与 ET 同机部署配置，Router01 使用 WebSocket 监听。
# 微信后台的 request 和 socket 合法域名分别填写 https://game.example.com 和 wss://game.example.com。
# 客户端 RouterHttpUrl 填 https://game.example.com，RouterWebSocketUrl 填 wss://game.example.com/ws/。

server {
    listen 443 ssl;
    server_name game.example.com;

    ssl_certificate     /etc/nginx/certs/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/game.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /get_router {
        proxy_pass http://127.0.0.1:30300;
    }

    location = /ws/ {
        proxy_pass http://127.0.0.1:30301;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 后端 HttpListener 按 Router 的 IP、端口和 /ws/ 路径匹配握手请求。
        proxy_set_header Host $proxy_host;
    }

    location / {
        return 404;
    }
}
